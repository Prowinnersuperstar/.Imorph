<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>IMORPH</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    font-size: 48px;
    margin-bottom: 5px;
}

p {
    color: #aaa;
}

button, label {
    background: #5865f2;
    color: white;
    border: 0;
    padding: 14px 22px;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    display: inline-block;
    margin: 8px;
}

button:hover, label:hover {
    background: #7280ff;
}

input {
    display: none;
}

canvas {
    max-width: 80%;
    max-height: 65vh;
    margin-top: 20px;
    border-radius: 12px;
    box-shadow: 0 0 30px #000;
}

#info {
    margin-top: 15px;
    color: #aaa;
}
</style>
</head>

<body>

<h1>IMORPH</h1>
<p>An image that changes every time you open it.</p>

<label>
    Create IMORPH
    <input type="file" id="create" accept="image/*">
</label>

<label>
    Open IMORPH
    <input type="file" id="open" accept=".imorph,.json">
</label>

<br>

<button id="download" style="display:none;">
    Save This Generation
</button>

<div id="info"></div>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let currentData = null;


// =============================
// CREATE IMORPH
// =============================

document.getElementById("create").addEventListener("change", async e => {

    const file = e.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = () => {

        currentData = {
            format: "IMORPH",
            version: 1,
            generation: 0,
            image: reader.result
        };

        showMorph();

    };

    reader.readAsDataURL(file);
});


// =============================
// OPEN IMORPH
// =============================

document.getElementById("open").addEventListener("change", async e => {

    const file = e.target.files[0];

    if (!file) return;

    const text = await file.text();

    try {

        currentData = JSON.parse(text);

        if (currentData.format !== "IMORPH") {
            alert("That isn't an IMORPH file.");
            return;
        }

        showMorph();

    } catch {

        alert("Invalid IMORPH file.");

    }

});


// =============================
// MORPH
// =============================

function showMorph() {

    const img = new Image();

    img.onload = () => {

        canvas.width = img.width;
        canvas.height = img.height;

        ctx.drawImage(img, 0, 0);

        let image = ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );

        const pixels = image.data;

        const generation =
            (currentData.generation || 0) + 1;

        // Different mutation every generation
        const strength =
            Math.min(35, 5 + generation * 2);

        for (let i = 0; i < pixels.length; i += 4) {

            // Slowly alter colours
            pixels[i] =
                Math.max(0,
                Math.min(255,
                pixels[i] +
                random(-strength, strength)));

            pixels[i + 1] =
                Math.max(0,
                Math.min(255,
                pixels[i + 1] +
                random(-strength, strength)));

            pixels[i + 2] =
                Math.max(0,
                Math.min(255,
                pixels[i + 2] +
                random(-strength, strength)));

        }

        ctx.putImageData(image, 0, 0);

        // Store the new generation
        currentData.generation = generation;

        currentData.image =
            canvas.toDataURL("image/png");

        document.getElementById("info").textContent =
            "Generation " + generation;

        document.getElementById("download").style.display =
            "inline-block";

    };

    img.src = currentData.image;

}


// =============================
// RANDOM
// =============================

function random(min, max) {

    return Math.floor(
        Math.random() * (max - min + 1)
    ) + min;

}


// =============================
// SAVE
// =============================

document.getElementById("download").onclick = () => {

    const blob = new Blob(
        [JSON.stringify(currentData)],
        { type: "application/json" }
    );

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");

    a.href = url;

    a.download =
        "generation-" +
        currentData.generation +
        ".imorph";

    a.click();

    URL.revokeObjectURL(url);

};

</script>

</body>
</html>
